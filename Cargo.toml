[package]
name = "neptunium-helper"
version = "0.1.0"
edition = "2024"

[dependencies]
color-eyre = "0.6.5"
dotenvy = "0.15.7"
evalexpr = "13.1.0"
fluxer-neptunium = { git = "https://github.com/PilkeySEK/fluxer-neptunium.git", features = [
    "experimental-macros",
] }
rustls = { version = "0.23.41", features = ["ring"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.52.3", features = ["rt-multi-thread", "fs", "macros"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[features]
default = []
docker = []

[[bin]]
name = "app"
path = "src/main.rs"

[lints.clippy]
pedantic = "warn"